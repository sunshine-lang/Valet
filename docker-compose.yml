services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: valet
      POSTGRES_PASSWORD: valet
      POSTGRES_DB: valet
      TZ: UTC
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U valet -d valet"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
